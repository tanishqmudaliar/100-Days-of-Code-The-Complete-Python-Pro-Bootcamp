<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>{{ title }}</title>
  <style>
    body { margin: 0; min-height: 100vh; display: flex; align-items: center; justify-content: center; background: #fff; font-family: -apple-system, system-ui, sans-serif; }
    .window { padding: 20px; width: 400px; display: grid; grid-template-columns: auto 1fr auto; gap: 8px 5px; align-items: center; }
    .logo { grid-column: 1 / 4; display: flex; justify-content: center; margin-bottom: 10px; }
    .logo img { width: 100px; height: 100px; }
    label { text-align: right; }
    input { box-sizing: border-box; width: 100%; padding: 6px; }
    button { padding: 6px 10px; cursor: pointer; white-space: nowrap; }
    .add { grid-column: 1 / 4; margin-top: 4px; }
    .note { grid-column: 1 / 4; color: #8a7358; font-size: .8rem; margin-top: 8px; }
    .back { position: fixed; top: 1rem; left: 1rem; color: #2f2013cc; text-decoration: none; }
  </style>
</head>
<body>
  <a class="back" href="/">&larr; All projects</a>
  <div class="window">
    <div class="logo">
      <img src="{{ url_for('project_asset', slug=project.slug, filename='logo.png') }}" alt="">
    </div>

    <label>Website:</label>
    <input id="website" type="text">
    <button onclick="search()">Search</button>

    <label>Email/Username:</label>
    <input id="email" type="text" value="example@gmail.com" style="grid-column: 2 / 4;">

    <label>Password:</label>
    <input id="password" type="text">
    <button onclick="generatePassword()">Generate Password</button>

    <button class="add" onclick="save()">Add</button>

    <p class="note">Saved entries live only in this browser tab and disappear when you close it — nothing is sent to the server.</p>
  </div>

<script>
const VAULT_KEY = "passwordManagerVault";

function loadVault() {
  try { return JSON.parse(sessionStorage.getItem(VAULT_KEY)) || {}; }
  catch { return {}; }
}
function saveVault(vault) {
  sessionStorage.setItem(VAULT_KEY, JSON.stringify(vault));
}

function generatePassword() {
  const letters = "abcdefghijklmnopqrstuvwxyzABCDEFGHIJKLMNOPQRSTUVWXYZ";
  const numbers = "0123456789";
  const symbols = "!#$%&()*+";
  const pick = (chars, n) => Array.from({length: n}, () => chars[Math.floor(Math.random() * chars.length)]);
  const randInt = (a, b) => a + Math.floor(Math.random() * (b - a + 1));
  let chars = [...pick(letters, randInt(8, 10)), ...pick(numbers, randInt(2, 4)), ...pick(symbols, randInt(2, 4))];
  for (let i = chars.length - 1; i > 0; i--) {
    const j = Math.floor(Math.random() * (i + 1));
    [chars[i], chars[j]] = [chars[j], chars[i]];
  }
  const password = chars.join("");
  document.getElementById("password").value = password;
  navigator.clipboard?.writeText(password);
}

function search() {
  const website = document.getElementById("website").value;
  if (!website) { alert("Please enter a website to search for."); return; }
  const entry = loadVault()[website];
  if (entry) {
    alert(`Email: ${entry.email}\nPassword: ${entry.password}`);
  } else {
    alert(`No details for ${website} exist.`);
  }
}

function save() {
  const website = document.getElementById("website").value;
  const email = document.getElementById("email").value;
  const password = document.getElementById("password").value;
  if (!website || !password) {
    alert("Please make sure you haven't left any fields empty.");
    return;
  }
  if (confirm(`These are the details entered:\nEmail: ${email}\nPassword: ${password}\nIs it ok to save?`)) {
    const vault = loadVault();
    vault[website] = { email, password };
    saveVault(vault);
    document.getElementById("website").value = "";
    document.getElementById("password").value = "";
  }
}
</script>
</body>
</html>
